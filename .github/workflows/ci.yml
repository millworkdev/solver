# Offline verification gates for this publishing repository, at parity with
# the sibling MCP publishing repository's guard set. Nothing here dispatches
# the publish workflow, publishes, or mutates any registry state, and
# publish.yml itself is never modified by CI parity work -- it is the bound
# trusted-publishing workflow.

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  content:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Pin Node.js 22.14.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.14.0"

      - name: Check public content rules
        run: node scripts/check-public-content.mjs

      - name: Exercise the content-check negatives
        run: node scripts/test-check-public-content.mjs

      - name: Verify the export manifest against the actual dist bytes
        run: node scripts/check-export-manifest.mjs

      - name: Lint workflows with pinned actionlint
        run: |
          set -euo pipefail
          curl --silent --show-error --location --output actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum --check
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint
          rm -f actionlint actionlint.tar.gz

  package:
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20.x", "22.x"]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Check the packed file set and manifest truth
        run: node scripts/check-packed-files.mjs

      - name: Smoke-test the installed artifact (module and millwork binary)
        run: node scripts/smoke-installed.mjs

  credential-boundary:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Pin Node.js 22.14.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.14.0"

      - name: Pin the npm CLI the publish workflow uses
        run: npm install --global npm@11.5.1

      - name: Exercise credential inspection against the real pinned npm
        run: bash scripts/test-token-absence-real-npm.sh
