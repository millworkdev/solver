# Trusted publishing for @millwork/solver.
# Manual dispatch after release acceptance; the npm-publish environment keeps
# its human approval. Publishes one new immutable version with OIDC provenance.
# Both packages use expected-version plus dist-tag (latest by default).
# No npm token is permitted. Publisher/environment configuration is unchanged.

name: publish

on:
  workflow_dispatch:
    inputs:
      expected-version:
        description: "Exact accepted version (must equal package.json)"
        required: true
      dist-tag:
        description: "npm dist-tag for the published version"
        required: true
        default: "latest"

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: npm-publish
    env:
      # Dispatch values reach shell scripts only through the environment.
      EXPECTED_VERSION: ${{ inputs.expected-version }}
      DIST_TAG: ${{ inputs.dist-tag }}
    steps:
      - name: Check out the dispatched ref
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Pin Node.js 22.14.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.14.0"

      - name: Pin npm CLI 11.5.1
        run: |
          set -euo pipefail
          npm install --global npm@11.5.1
          node_version="$(node --version)"
          npm_version="$(npm --version)"
          echo "node ${node_version} / npm ${npm_version}"
          test "${node_version}" = "v22.14.0"
          test "${npm_version}" = "11.5.1"

      - name: Check public content rules
        run: node scripts/check-public-content.mjs

      - name: Verify publish preconditions (immutable version, E404-only, token-free)
        run: bash scripts/verify-publish-preconditions.sh

      - name: Publish with OIDC provenance
        run: |
          set -euo pipefail
          if [ -n "${NODE_AUTH_TOKEN:-}" ] || [ -n "${NPM_TOKEN:-}" ]; then
            echo "::error::An npm auth token is present in the environment; trusted publishing must be token-free."
            exit 1
          fi
          npm publish --provenance --tag "${DIST_TAG}" --registry=https://registry.npmjs.org
